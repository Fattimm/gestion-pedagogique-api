version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    volumes:
      - .:/var/www
      - ./storage/app/firebase-credentials.json:/home/fatoumata/Documents/planningSA_ODC/gestion_pedagogique/storage/app/firebase-credentials.json
    networks:
      - laravel
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: gestion_academique
      DB_USERNAME: root
      DB_PASSWORD: F@tima123
      APP_PORT: 8080  
      FIREBASE_KEY_BASE64: /home/fatoumata/Documents/planningSA_ODC/gestion_pedagogique/storage/firebase.key
      GOOGLE_APPLICATION_CREDENTIALS: /var/www/firebase-key.json
    expose:
      - 8080

  webserver:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    depends_on:
      - app
    networks:
      - laravel

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_DATABASE: gestion_academique
      MYSQL_USER: root
      MYSQL_PASSWORD: F@tima123
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  mysql_data: